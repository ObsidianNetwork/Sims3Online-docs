name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Pages site URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: python -m pip install -r requirements-docs.txt
      - name: Check public documentation boundary
        run: |
          python - << 'PY'
          import pathlib, re

          forbidden_paths = [
              "docs/cortex",
              "docs/native-and-reverse-engineering",
              "docs/reverse-engineering.md",
              "docs/guides/remote-test-rig.md",
              "library",
              ".trail",
          ]
          errors = [f"forbidden internal path exists: {p}" for p in forbidden_paths if pathlib.Path(p).exists()]
          forbidden_patterns = [
              ("cortex-ref", re.compile(r"(?:^|[\s(\[/])cortex(?:/|\.md|\b)", re.I)),
              ("re-ref", re.compile(r"native-and-reverse-engineering|reverse-engineering\.md", re.I)),
              ("personal-path", re.compile(r"(?:[A-Za-z]:[\\/]+Users[\\/]+|/home/)(?!<|user|public|default|runner)[A-Za-z0-9._-]+", re.I)),
              ("private-infra", re.compile(r"\bunraid\b|unraid_|testrig|remote-test-rig", re.I)),
              ("tracker-id", re.compile(r"\bSIM-[0-9]+\b")),
          ]
          scan_files = [pathlib.Path("mkdocs.yml"), pathlib.Path("README.md")]
          scan_files.extend(sorted(p for p in pathlib.Path("docs").rglob("*.md") if p.is_file()))
          for path in scan_files:
              for lineno, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                  for label, pat in forbidden_patterns:
                      if pat.search(line):
                          errors.append(f"{path.as_posix()}:{lineno}: {label}: {line.strip()}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Public docs boundary check passed across {len(scan_files)} files.")
          PY
      - name: Build site
        env:
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
